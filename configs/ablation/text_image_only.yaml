# configs/ablation/text_image_only.yaml
# @package _global_

ablation_mode: text_image
experiment_name: ablation_text_image
output_dir: outputs/ablation_text_image

loss:
  contrastive_lambda: 0.1

training:
  modality_dropout: 0.15

# Residual connections
residual:
  enabled: true

# Classification head
classification_head:
  hidden_dim: 128
  output_dim: 1
  dropout: 0.3
