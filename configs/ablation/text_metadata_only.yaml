# configs/ablation/text_metadata_only.yaml
# @package _global_

ablation_mode: text_metadata
experiment_name: ablation_text_metadata
output_dir: outputs/ablation_text_metadata

loss:
  contrastive_lambda: 0.0

training:
  modality_dropout: 0.15

# Residual connections
residual:
  enabled: true

# Classification head
classification_head:
  hidden_dim: 128
  output_dim: 1
  dropout: 0.3
