# configs/base.yaml
# Master configuration. Other configs inherit from this and override specific fields.

# ========================================
# Ablation control (single source of truth)
# ========================================
ablation_mode: full

# ========================================
# Project paths
# ========================================
paths:
  data_dir: data/
  raw_csv: data/raw/ads_vietnam_clean.csv
  images_dir: data/raw/ad_images/
  processed_dir: data/processed/
  embeddings_dir: data/embeddings/
  metadata_scaler: data/processed/metadata_scaler.joblib
  output_dir: outputs/
  log_dir: outputs/logs/
  checkpoint_dir: experiments/

# ========================================
# Data
# ========================================
data:
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  use_offline_embeddings: false
  estimated_pos_rate: 0.609
  split_seed: 42
  split_strategy: page_level
  num_workers: 4
  pin_memory: true

# ========================================
# Model architecture
# ========================================
model:
  text_model_name: "vinai/phobert-base-v2"
  image_model_name: "vit_base_patch16_224"
  
  max_text_len: 256
  image_size: 224
  
  projection_dim: 256
  num_attn_heads: 8
  num_attn_layers: 1
  
  projection_dropout: 0.1
  attention_dropout: 0.1
  use_selective_attention: true
  attn_gate_init_logit: -2.0
  sample_gate_hidden: 64
  sample_gate_init_bias: -1.0
  classifier_dropout: 0.3
  aux_dropout: 0.2
  
  metadata_input_dim: 17

# ========================================
# Metadata feature engineering
# ========================================
metadata_features:
  - ads_per_page
  - platform_count
  - FB_only_flag
  - all_targeted
  - burstiness
  - avg_ad_duration
  - launch_delay
  - num_countries
  - language_location_mismatch
  - emoji_count
  - text_length
  - ads_duration
  - repeated_text_ratio
  - exclamation_ratio
  - caps_word_ratio
  - repeated_punct_count
  - url_count

# ========================================
# Training
# ========================================
training:
  batch_size: 32
  max_epochs: 30
  patience: 8
  early_stopping_metric: auc_roc
  
  lr_fusion: 3.0e-4
  lr_encoders: 3.0e-6
  weight_decay: 0.01
  warmup_steps: 800
  lr_min: 1.0e-7
  
  freeze_encoder_epochs: 3
  unfreeze_top_k_blocks: 4
  
  modality_dropout: 0.15
  gradient_clip: 1.0
  use_amp: true
  device: cuda

# ========================================
# Loss
# ========================================
loss:
  cls_loss_type: bce
  
  # BCE-specific
  label_smoothing: 0.0
  
  # Focal-specific
  focal_alpha: 0.5
  focal_gamma: 2.0
  focal_gamma_pos: 1.0
  focal_gamma_neg: 4.0
  
  # Contrastive
  contrastive_lambda: 0.1
  contrastive_temperature_init: 0.07
  aux_lambda: 0.1

# ========================================
# Text processing
# ========================================
text:
  columns:
    - ad_creative_bodies
    - ad_creative_link_titles

# ========================================
# Logging
# ========================================
logging:
  log_interval: 50
  diag_interval: 200
  log_to_wandb: false
  wandb_project: misinfo_detect
