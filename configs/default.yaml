# configs/default.yaml
# Default profile: Full multimodal model
# @package _global_

ablation_mode: full
experiment_name: multimodal_full
output_dir: outputs/multimodal_full

# Data configuration
data:
  data_dir: 'data'
  raw_dir: 'data/raw'
  processed_dir: 'data/processed'
  embeddings_dir: 'data/embeddings'
  train_size: 0.7
  val_size: 0.15
  test_size: 0.15
  num_workers: 4