# configs/model/text_only.yaml
# @package _global_

ablation_mode: text_only
experiment_name: ablation_text_only
output_dir: outputs/ablation_text_only

loss:
  contrastive_lambda: 0.0
  label_smoothing: 0.0

training:
  modality_dropout: 0.0

# Gating fusion - DISABLED
gating_fusion:
  enabled: false

# Residual connections
residual:
  enabled: true

# Classification head
classification_head:
  hidden_dim: 128
  output_dim: 1
  dropout: 0.3
